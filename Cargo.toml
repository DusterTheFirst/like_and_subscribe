[package]
name    = "like_and_subscribe"
version = "0.1.0"
edition = "2024"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = true

[dependencies]
google-youtube3    = { version = "6.0.0", default-features = false }
jiff               = { version = "0.2.15", features = ["serde"] }
serde              = "1.0.219"
serde_derive       = "1.0.219"
serde_json         = "1.0.141"
tracing            = "0.1.41"
tracing-error      = "0.2.1"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
oauth2             = { version = "5.0.0", default-features = false, features = ["ureq"] }
redb               = "3.0.2"
envconfig          = "0.11.0"
eframe             = "0.33.0"
ehttp              = "0.5.0"
tiny_http          = "0.12.0"
egui_extras        = { version = "0.33.0", features = ["all_loaders"] }
ureq               = { version = "2", features = ["json"] }
image              = { version = "0.25", features = ["jpeg"] }
nutype             = "0.6.2"
rayon              = "1.11.0"
